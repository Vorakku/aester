  function chartData(mode=ui.graph){

    filteredInvoices().forEach(i=>{const b=buckets.find(b=>i.date>=b.begin&&i.date<=b.last);if(b){b.sales+=i.subtotal-i.discount;b.cost+=i.cogs||0;}});

  function lineChart(){

    return `<svg class="line-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Revenue and cost of goods chart" role="img"><defs><linearGradient id="revenueFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#77aa8b" stop-opacity=".17"/><stop offset="1" stop-color="#77aa8b" stop-opacity=".015"/></linearGradient></defs>${[0,.25,.5,.75,1].map(n=>`<line x1="${left}" y1="${y(n*max)}" x2="${w-right}" y2="${y(n*max)}" stroke="#eef2ec" stroke-dasharray="3 4"/><text x="${left-9}" y="${y(n*max)+3}" text-anchor="end">${n*max>=1000?'$'+(n*max/1000).toFixed(1)+'k':'$'+Math.round(n*max)}</text>`).join('')}<path d="${area}" fill="url(#revenueFill)"/><polyline points="${costPoints}" fill="none" stroke="#c7d9c9" stroke-width="1.5" stroke-dasharray="4 4"/><polyline points="${points}" class="chart-line"/>${data.map((d,n)=>`<g><circle cx="${x(n)}" cy="${y(d.sales)}" r="3.4" fill="white" stroke="#438f6b" stroke-width="1.5"/><circle cx="${x(n)}" cy="${y(d.sales)}" r="14" fill="transparent"><title>${e(d.label)} · Sales: ${money(d.sales)} · Cost: ${money(d.cost)}</title></circle>${n%step?'':`<text x="${x(n)}" y="${h-7}" text-anchor="middle">${e(d.label)}</text>`}</g>`).join('')}</svg>`;
  }
  function revenuePanel(){const invoices=filteredInvoices(),revenue=A.sum(invoices,i=>i.subtotal-i.discount),cogs=A.sum(invoices,i=>i.cogs||0);return `<section class="panel">${panelHeader('Revenue overview','A healthy business starts with a clear view.',`<div class="segmented"><button data-action="graph" data-value="month" class="${ui.graph==='month'?'active':''}">Monthly</button><button data-action="graph" data-value="week" class="${ui.graph==='week'?'active':''}">Weekly</button></div>`)}<div class="panel-body"><div class="chart-summary"><strong>${compactMoney(revenue)}</strong><span>in the last ${ui.period} days</span></div><div class="legend"><span><i class="legend-dot"></i>Revenue</span><span><i class="legend-dot gray"></i>Cost of goods</span></div>${lineChart()}<div class="chart-footer"><span>${invoices.length} issued invoices in this period</span><strong>${revenue?Math.round((revenue-cogs)/revenue*100):0}% gross margin ${icon('trend')}</strong></div></div></section>`;}
  function inventoryHealth(){const normal=state.products.filter(p=>A.productStatus(state,p)==='In stock').length,low=state.products.filter(p=>A.productStatus(state,p)==='Low stock').length,out=state.products.length-normal-low,total=state.products.length||1,colors=['#458b68','#dcc68b','#db9b8d'],vals=[normal,low,out];let offset=0;return `<section class="panel">${panelHeader('Inventory health','A snapshot of your catalog.',go('inventory','View all'))}<div class="panel-body"><div class="health-donut"><svg viewBox="0 0 180 180" role="img" aria-label="${normal} in stock, ${low} low stock, ${out} out of stock"><circle cx="90" cy="90" r="64" fill="none" stroke="#f0f4ed" stroke-width="15"/>${vals.map((v,i)=>{const start=offset;offset+=v/total*402.12;return `<circle cx="90" cy="90" r="64" fill="none" stroke="${colors[i]}" stroke-width="15" stroke-dasharray="${Math.max(0,v/total*402.12-(v?5:0))} 402.12" stroke-dashoffset="${-start}" stroke-linecap="round"/>`;}).join('')}</svg><div class="donut-content"><strong>${number(state.products.length)}</strong><span>total products</span></div></div><div class="health-list">${['In stock','Low stock','Out of stock'].map((label,i)=>`<div class="health-row"><span><i style="background:${colors[i]}"></i>${label}</span><strong>${vals[i]} <span class="muted" style="display:inline;margin-left:7px;font-size:9px">${Math.round(vals[i]/total*100)}%</span></strong></div>`).join('')}<div class="health-note">${icon('leaf')} ${Math.round(normal/total*100)}% of your products are well stocked.</div></div></div></section>`;}

  function analytics(){

ontribution','Your most active business relationships.')}<div class="panel-body">${customers.map((x,n)=>`<div class="attention-item" style="padding:13px 0"><span class="contact-initials">${e(initials(x.c.name))}</span><div class="product-info"><strong>${e(x.c.name)}</strong><small>${x.invoices.length} invoices this period</small></div><strong style="font-size:11px;color:#617a5b;font-weight:550">${compactMoney(x.revenue)}</strong></div>`).join('')}</div></section></div>`;

  function productDetail(id){const p=A.product(state,id);if(!p)return;const items=state.batches.filter(b=>b.productId===id&&b.qty>0).sort((a,b)=>a.expiry.localeCompare(b.expiry));modal('Product details',p.sku,`<div class="detail-hero">${art(p)}<div><h3>${e(p.name)}</h3><p>${e(p.generic)} · ${e(p.category)}</p></div></div>${badge(A.productStatus(state,p))}<div class="detail-stats"><div><small>Sellable stock</small><strong>${number(A.available(state,id))} <span style="font-size:10px;font-weight:400">${e(p.unit)}s</span></strong></div><div><small>Physical stock</small><strong>${number(A.onHand(state,id))}</strong></div><div><small>Selling price</small><strong>${money(p.price)}</strong></div><div><small>Reorder threshold</small><strong>${p.reorder}</strong></div></div><ul class="summary-list"><li><span>SKU</span><strong>${e(p.sku)}</strong></li><li><span>Barcode</span><strong>${e(p.barcode||'—')}</strong></li><li><span>Preferred supplier</span><strong>${e(A.contact(state,p.supplierId)?.name||'—')}</strong></li><li><span>Stock value at batch cost</span><strong>${money(A.sum(items,b=>b.qty*b.cost))}</strong></li></ul><h3 class="detail-label">Batches on hand</h3>${items.map(b=>`<button class="detail-batch" data-action="batch-detail" data-id="${e(b.id)}" style="width:100%;text-align:left"><div><strong>${e(b.code)}</strong><small>${e(A.warehouse(state,b.warehouseId)?.name)} · Exp ${date(b.expiry)}</small></div><div style="text-align:right"><strong>${b.qty} ${e(p.unit)}s</strong><br>${badge(batchStatus(b))}</div></button>`).join('')||empty('No stock yet','Receive a batch to add inventory.')}<div class="detail-actions">${button('Edit product','product-form','edit','',`data-id="${e(id)}"`)}${button('Receive stock','receive-stock','receive','primary',`data-id="${e(id)}"`)}</div>`,{drawer:true});}
  function receiveForm(id=''){const p=A.product(state,id);modal('Receive stock','Record an incoming batch and its payment source.',formStart('receive-form')+`<div class="form-grid">${selectField('Product','productId',productOptions(id,true),'full')}${field('Batch / lot number','code','','text','',true)}${field('Expiry date','expiry',A.shift(365),'date','',true,`min="${A.shift(1)}"`)}${field('Quantity (stock units)','qty',100,'number','',true,'min="1" step="1"')}${field('Actual unit cost ($)','cost',p?.cost||0,'number','',true,'min="0" step="0.01"')}${selectField('Warehouse','warehouseId',warehouseOptions('wh_main','Select warehouse'))}${selectField('Supplier','supplierId',contactOptions('Supplier',p?.supplierId||''))}${selectField('Payment source','payment','<option value="credit">Supplier credit — accounts payable</option><option value="cash">Paid from cash & bank</option>','full')}</div><div class="info-callout">Stock value uses the actual batch cost. Supplier credit creates a bill in Accounting → Payables.</div>${formFooter('Receive stock')}</form>`);}
  function batchDetail(id){const b=state.batches.find(x=>x.id===id);if(!b)return;const p=A.product(state,b.productId);modal('Batch details','Traceability from receipt to sale.',`<div class="detail-hero">${art(p)}<div><h3>${e(p.name)}</h3><p>Lot ${e(b.code)}</p></div></div>${badge(batchStatus(b))}<div class="detail-stats"><div><small>Quantity on hand</small><strong>${number(b.qty)} ${e(p.unit)}s</strong></div><div><small>Batch value</small><strong>${money(b.qty*b.cost)}</strong></div></div><ul class="summary-list"><li><span>Warehouse</span><strong>${e(A.warehouse(state,b.warehouseId)?.name)}</strong></li><li><span>Received</span><strong>${date(b.received)}</strong></li><li><span>Expiry date</span><strong>${date(b.expiry)}</strong></li><li><span>Actual unit cost</span><strong>${money(b.cost)}</strong></li><li><span>Quality status</span><strong>${b.quarantined?'Quarantined':'Released'}</strong></li></ul><div class="info-callout">${A.daysLeft(b.expiry)<=0?'This batch has expired and cannot be used for invoices.':b.quarantined?'This batch is held for quality review and cannot be sold.':'Invoices allocate this batch by earliest expiry first.'}</div><div class="detail-actions">${button('Transfer','transfer','transfer','',`data-id="${e(id)}"`)}${button(b.quarantined?'Release batch':'Quarantine','quarantine','shield','',`data-id="${e(id)}"`)}${button('Write off','dispose','trash','danger',`data-id="${e(id)}"`)}</div>`,{drawer:true});}
  function transferForm(id=''){const items=state.batches.filter(b=>b.qty>0);modal('Transfer stock','Move a traceable batch between warehouse locations.',formStart('transfer-form')+`<div class="form-grid">${selectField('Source batch','batchId','<option value="">Select a batch</option>'+items.map(b=>`<option value="${e(b.id)}" ${b.id===id?'selected':''}>${e(A.product(state,b.productId).name)} · ${e(b.code)} · ${e(A.warehouse(state,b.warehouseId).name)} (${b.qty})</option>`).join(''),'full')}${selectField('Destination warehouse','to',warehouseOptions('','Select destination'))}${field('Quantity to transfer','qty',1,'number','',true,'min="1" step="1"')}</div><div class="info-callout">The batch number, expiry date, quality status and unit cost are preserved. Total inventory value stays the same.</div>${formFooter('Transfer stock')}</form>`);}
  function disposeForm(id){const b=state.batches.find(b=>b.id===id);modal('Write off batch','Remove this stock and record an inventory loss.',formStart('dispose-form',`data-id="${e(id)}"`)+`<div class="info-callout">This writes off all ${b.qty} remaining units of ${e(b.code)} (${money(b.qty*b.cost)}). The batch remains in the audit history.</div>${field('Reason for write-off','reason',A.daysLeft(b.expiry)<=0?'Expired stock':'','text','',true)}${formFooter('Write off stock')}</form>`);}
  function invoiceLines(lines,purchase=false){return `<div class="line-items-head"><span>Product</span><span>Qty</span><span>${purchase?'Cost':'Price'} ($)</span><span>Total</span><span></span></div><div id="line-rows">${lines.map(l=>lineRow(l,purchase)).join('')}</div>`;}
  function lineRow(l={},purchase=false){return `<div class="line-item" data-line><select name="line-product" required aria-label="Line product">${productOptions(l.productId||'',purchase)}</select><input name="line-qty" type="number" value="${e(l.qty||1)}" required min="1" step="1" aria-label="Line quantity"><input name="line-price" type="number" value="${e(l.price??l.cost??0)}" required min="0" step="0.01" aria-label="Line unit ${purchase?'cost':'price'}"><span class="line-total">${money((l.qty||1)*(l.price||l.cost||0))}</span><button type="button" class="icon-button" data-action="remove-line" aria-label="Remove line">${icon('trash')}</button></div>`;}
  function invoiceForm(id){const i=id?state.invoices.find(i=>i.id===id):null;if(id&&i?.status!=='Draft'){toast('Only drafts can be edited.',true);return;}modal(i?'Edit draft invoice':'Create an invoice','Review, issue, and receive payment in one connected flow.',formStart('invoice-form',`data-id="${e(id||'')}"`)+`<div class="form-grid">${selectField('Customer','customerId',contactOptions('Customer',i?.customerId),'full')}${field('Invoice date','date',i?.date||A.today(),'date','',true,`max="${A.today()}"`)}${field('Due date','due',i?.due||A.shift(30),'date','',true)}</div><div class="form-section">Invoice items</div><div class="line-items">${invoiceLines(i?.lines||[{}])}</div><button type="button" class="text-button" data-action="add-line">${icon('plus')}Add another product</button><div class="form-grid" style="margin-top:24px">${field('Discount ($)','discount',i?.discount||0,'number','','','min="0" step="0.01"')}${field('Tax rate (%)','taxRate',i?.taxRate??state.settings.taxRate,'number','','','min="0" max="100" step="0.01"')}</div><div class="invoice-summary" id="invoice-summary"></div><div class="form-field full"><label for="f-notes">Notes / payment terms</label><textarea name="notes" id="f-notes">${e(i?.notes||'Thank you for your business. Please include the invoice number with your payment.')}</textarea></div><div class="info-callout">Save as a draft to review later. Issuing deducts sellable stock using first-expiry-first-out and records the sale in your accounts.</div><div class="form-footer"><button type="button" class="btn" data-action="close">Cancel</button><button type="submit" class="btn" name="mode" value="draft">Save draft</button><button type="submit" class="btn primary" name="mode" value="issue">${icon('check')}Issue invoice</button></div></form>`,{large:true});updateLineTotals();}
  function readLines(purchase=false){return $$('[data-line]',$('#line-rows')).map(row=>({productId:$('[name="line-product"]',row).value,qty:Number($('[name="line-qty"]',row).value),[purchase?'cost':'price']:Number($('[name="line-price"]',row).value)}));}
  function updateLineTotals(){const form=$('#invoice-form')||$('#purchase-form');if(!form)return;const purchase=form.id==='purchase-form',lines=readLines(purchase);$$('[data-line]',form).forEach((row,n)=>$('.line-total',row).textContent=money(lines[n].qty*(purchase?lines[n].cost:lines[n].price)));const subtotal=A.sum(lines,l=>l.qty*(purchase?l.cost:l.price)),discount=purchase?0:Number($('[name="discount"]',form).value)||0,taxRate=purchase?0:Number($('[name="taxRate"]',form).value)||0,tax=A.round(Math.max(0,subtotal-discount)*taxRate/100);$('#invoice-summary').innerHTML=`<div><span>Subtotal</span><span>${money(subtotal)}</span></div>${!purchase?`<div><span>Discount</span><span>− ${money(discount)}</span></div><div><span>Tax (${taxRate}%)</span><span>${money(tax)}</span></div>`:''}<div class="invoice-total"><span>Total</span><span>${money(subtotal-discount+tax)}</span></div>`;}
  function invoiceDocument(i){const c=A.contact(state,i.customerId);return `<div class="invoice-document" id="print-document"><div class="invoice-document-header"><div><div class="invoice-brand">aster<span style="color:#adc298;font-size:15px;margin-left:3px">✳</span><small>${e(state.settings.company)}</small></div><p style="margin-top:12px">${e(state.settings.address)}</p><p>${e(state.settings.email)}</p><p>${e(state.settings.phone)}</p></div><div><h3>INVOICE</h3><p>${e(i.number)}</p><p>${date(i.date)}</p><div style="margin-top:9px">${badge(A.invoiceStatus(i))}</div></div></div><div class="invoice-document-parties"><div><span>Bill to</span><strong>${e(c?.name)}</strong>${e(c?.address)}<br>${e(c?.email)}</div><div style="text-align:right"><span>Payment due</span><strong>${date(i.due)}</strong>Currency: USD</div></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>${i.lines.map(l=>`<tr><td style="white-space:normal"><strong>${e(l.name)}</strong><div style="font-size:9px;margin-top:5px">${e(l.sku)}</div></td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</tbody></table></div><div class="invoice-summary"><div><span>Subtotal</span><span>${money(i.subtotal)}</span></div><div><span>Discount</span><span>− ${money(i.discount)}</span></div><div><span>Tax (${i.taxRate}%)</span><span>${money(i.taxAmount)}</span></div><div class="invoice-total"><span>Total</span><span>${money(i.total)}</span></div><div><span>Amount paid</span><span>${money(i.paid)}</span></div><div><span>${i.status==='Draft'?'On issue':'Balance due'}</span><strong>${money(i.total-i.paid)}</strong></div></div>${i.notes?`<div class="invoice-note">${e(i.notes)}</div>`:''}</div>`;}
  function invoiceDetail(id){const i=state.invoices.find(i=>i.id===id);if(!i)return;modal(i.number,A.contact(state,i.customerId)?.name,invoiceDocument(i)+`<div class="detail-actions">${button('Print / PDF','print','print','')}${i.status==='Draft'?button('Edit draft','invoice-form','edit','',`data-id="${e(id)}"`)+button('Issue invoice','issue-invoice','check','primary',`data-id="${e(id)}"`):A.invoiceBalance(i)>0?button('Record payment','invoice-payment','wallet','primary',`data-id="${e(id)}"`):badge('Paid')}</div>${i.status==='Draft'?`<div class="form-footer"><button class="text-button" style="color:#c77c6c" data-action="delete-draft" data-id="${e(id)}">${icon('trash')}Delete draft</button></div>`:''}${i.payments.length?`<h3 class="detail-label">Payment history</h3>${i.payments.map(p=>`<div class="detail-batch"><div><strong>${e(p.method)}</strong><small>${date(p.date)}</small></div><strong>${money(p.amount)}</strong></div>`).join('')}`:''}${i.allocations.length?`<h3 class="detail-label">Allocated batches (FEFO)</h3>${i.allocations.map(a=>`<div class="detail-batch"><div><strong>${e(a.code)}</strong><small>${e(A.product(state,a.productId)?.name)} · ${e(A.warehouse(state,a.warehouseId)?.name)}</small></div><strong>${a.qty} units</strong></div>`).join('')}`:''}`,{large:true});}
  function paymentForm(id,bill=false){const i=bill?[...state.purchases,...state.receipts].find(x=>x.id===id):state.invoices.find(i=>i.id===id),amount=A.round(i.total-i.paid);modal(bill?'Pay supplier bill':'Record a payment',(i.number||i.reference)+' · Outstanding '+money(amount),formStart(bill?'bill-payment-form':'invoice-payment-form',`data-id="${e(id)}"`)+`<div class="form-grid">${field('Payment amount ($)','amount',amount,'number','',true,`min="0.01" max="${amount}" step="0.01"`)}${field('Payment date','date',A.today(),'date','',true,`max="${A.today()}"`)}${!bill?selectField('Payment method','method','<option>Bank transfer</option><option>Cash</option><option>Card</option><option>Other</option>','full'):''}</div><div class="info-callout">${bill?'This reduces accounts payable and cash & bank.':'This reduces accounts receivable and increases cash & bank. Partial payments are supported.'}</div>${formFooter(bill?'Record supplier payment':'Record payment')}</form>`);}
  function purchaseForm(){modal('New purchase order','Plan incoming stock and track its delivery.',formStart('purchase-form')+`<div class="form-grid">${selectField('Supplier','supplierId',contactOptions('Supplier'),'full')}${selectField('Receiving warehouse','warehouseId',warehouseOptions('wh_main','Select warehouse'))}${field('Order date','date',A.today(),'date','',true,`max="${A.today()}"`)}${field('Expected delivery','expected',A.shift(5),'date','full',true)}</div><div class="form-section">Order items</div><div class="line-items">${invoiceLines([{}],true)}</div><button type="button" class="text-button" data-action="add-line">${icon('plus')}Add another product</button><div class="invoice-summary" id="invoice-summary"></div><div class="form-field full"><label for="f-notes">Notes</label><textarea name="notes" id="f-notes" placeholder="Delivery instructions, supplier reference..."></textarea></div>${formFooter('Create purchase order')}</form>`,{large:true});updateLineTotals();}
  function purchaseDetail(id){const p=state.purchases.find(x=>x.id===id);if(!p)return;modal(p.number,A.contact(state,p.supplierId)?.name,`${badge(p.status)}<ul class="summary-list" style="margin:15px 0 22px"><li><span>Supplier</span><strong>${e(A.contact(state,p.supplierId)?.name)}</strong></li><li><span>Warehouse</span><strong>${e(A.warehouse(state,p.warehouseId)?.name)}</strong></li><li><span>Order date</span><strong>${date(p.date)}</strong></li><li><span>Expected delivery</span><strong>${date(p.expected)}</strong></li>${p.received?`<li><span>Received</span><strong>${date(p.received)}</strong></li>`:''}</ul><div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Cost</th><th>Total</th></tr></thead><tbody>${p.lines.map(l=>`<tr><td><strong>${e(l.name)}</strong></td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</tbody></table></div><ul class="summary-list" style="margin-top:18px"><li class="total"><span>Order total</span><strong>${money(p.total)}</strong></li>${p.status==='Received'?`<li><span>Supplier balance</span><strong>${money(p.total-p.paid)}</strong></li>`:''}</ul>${p.notes?`<div class="info-callout">${e(p.notes)}</div>`:''}<div class="detail-actions">${p.status==='Ordered'?button('Cancel order','cancel-purchase','close','danger',`data-id="${e(id)}"`)+button('Receive order','purchase-receive','receive','primary',`data-id="${e(id)}"`):p.status==='Received'&&p.paid<p.total?button('Pay supplier','bill-payment','wallet','primary',`data-id="${e(id)}"`):''}</div>`,{large:true});}
  function purchaseReceive(id){const p=state.purchases.find(x=>x.id===id);if(!p||p.status!=='Ordered')return;modal('Receive '+p.number,'Confirm the actual lot number and expiry of every product.',formStart('purchase-receive-form',`data-id="${e(id)}"`)+`${field('Receipt date','date',A.today(),'date','',true,`max="${A.today()}"`)}${p.lines.map((l,n)=>`<div class="form-section">${e(l.name)} <span class="muted" style="font-weight:400">· ${l.qty} ${e(l.unit)}s</span></div><div class="form-grid">${field('Actual batch / lot number','batch-'+n,'','text','',true)}${field('Actual expiry date','expiry-'+n,'','date','',true,`min="${A.shift(1)}"`)}</div>`).join('')}<div class="info-callout">Receives all ordered units into ${e(A.warehouse(state,p.warehouseId)?.name)}. Stock increases by ${money(p.total)}, with the same amount posted to accounts payable.</div>${formFooter('Receive all items')}</form>`,{large:true});}
  function expenseForm(){modal('Record an expense','Keep the costs of your operation in the picture.',formStart('expense-form')+`<div class="form-grid">${field('Description','description','','text','full',true)}${field('Amount ($)','amount','','number','',true,'min="0.01" step="0.01"')}${field('Expense date','date',A.today(),'date','',true,`max="${A.today()}"`)}${selectField('Category','category','<option>Rent & utilities</option><option>Logistics</option><option>Payroll</option><option>Office supplies</option><option>Maintenance</option><option>Other</option>')}${field('Reference (optional)','reference')}</div>${formFooter('Record expense')}</form>`);}
  function contactForm(id){const c=id?A.contact(state,id):{};modal(id?'Edit contact':'Add a contact','Keep customers and suppliers close at hand.',formStart('contact-form',`data-id="${e(id||'')}"`)+`<div class="form-grid">${selectField('Contact type','type',['Customer','Supplier'].map(t=>`<option ${c.type===t?'selected':''}>${t}</option>`).join(''),'full')}${field('Business / contact name','name',c.name,'text','full',true)}${field('Contact person','person',c.person)}${field('Phone number','phone',c.phone,'tel')}${field('Email address','email',c.email,'email','full')}${field('Address','address',c.address,'text','full')}</div>${formFooter('Save contact')}</form>`);}
  function contactDetail(id){const c=A.contact(state,id);if(!c)return;const customer=c.type==='Customer',items=customer?state.invoices.filter(i=>i.customerId===id):state.purchases.filter(p=>p.supplierId===id);modal(c.name,c.type,`<div class="detail-hero"><span class="contact-initials" style="width:55px;height:55px;font-size:17px">${e(initials(c.name))}</span><div><h3>${e(c.name)}</h3><p>${e(c.person)}</p></div></div><ul class="summary-list"><li><span>Email</span><strong>${e(c.email||'—')}</strong></li><li><span>Phone</span><strong>${e(c.phone||'—')}</strong></li><li><span>Address</span><strong>${e(c.address||'—')}</strong></li></ul><h3 class="detail-label">${customer?'Invoice':'Purchase order'} history</h3>${items.slice(0,10).map(i=>`<button class="detail-batch" style="width:100%;text-align:left" data-action="${customer?'invoice-detail':'purchase-detail'}" data-id="${e(i.id)}"><div><strong>${e(i.number)}</strong><small>${date(i.date)}</small></div><div style="text-align:right"><strong>${money(i.total)}</strong><br>${badge(customer?A.invoiceStatus(i):i.status)}</div></button>`).join('')||empty('No transactions yet','Activity will appear here after your first transaction.')}<div class="detail-actions">${button('Edit contact','contact-form','edit','',`data-id="${e(id)}"`)}</div>`,{drawer:true});}
  function helpContent(){return `<div class="help-grid">${[['box','01 · Build your catalog','Add products with purchase cost, selling price, stock units, and a reorder threshold.'],['receive','02 · Bring stock in','Receive batches directly or create a purchase order. Enter the actual lot and expiry date.'],['invoice','03 · Make the sale','Save a draft or issue an invoice. Stock is allocated from sellable batches by earliest expiry.'],['wallet','04 · Close the loop','Record customer payments, supplier payments, and expenses. Your ledger and reports update together.']].map(([ic,title,text])=>`<div class="help-step">${icon(ic)}<strong>${title}</strong><p>${text}</p></div>`).join('')}</div><div class="info-callout">This is a browser-based demonstration with sample data. Your changes are saved on this device. Use Settings → Data & backups to export records, restore a backup, or start an empty workspace.</div>`;}
  function alerts(){const low=lowProducts(),exp=expiryBatches();modal('Your stock alerts','Keep tomorrow’s operations running smoothly.',`<div class="account-banner">${icon('bell')}<div><strong>${low.length+exp.length} items need attention</strong><p>${low.length} low-stock products · ${exp.length} expiry alerts</p></div></div>${low.map(p=>`<div class="notification-item"><span class="activity-icon amber">${icon('box')}</span><div><strong>${e(p.name)} is running low</strong><p>${A.available(state,p.id)} ${e(p.unit)}s available · reorder at ${p.reorder}.</p><button class="text-button" data-action="receive-stock" data-id="${e(p.id)}">Receive stock ${icon('arrow')}</button></div></div>`).join('')}${exp.map(b=>`<div class="notification-item"><span class="activity-icon amber">${icon('clock')}</span><div><strong>${e(A.product(state,b.productId)?.name)}</strong><p>Batch ${e(b.code)} · ${A.daysLeft(b.expiry)<=0?'Expired on '+date(b.expiry):'Expires in '+A.daysLeft(b.expiry)+' days'} · ${b.qty} units.</p><button class="text-button" data-action="batch-detail" data-id="${e(b.id)}">Review batch ${icon('arrow')}</button></div></div>`).join('')}${!low.length&&!exp.length?empty('All clear','There are no stock or expiry alerts.','check'):''}`,{drawer:true});}
  function commandSearch(){modal('Search workspace','',`<h2 id="dialog-title" style="position:absolute;left:-9999px">Search workspace</h2><div class="command-input">${icon('search')}<input id="command-q" placeholder="Search products, invoices, contacts..." aria-label="Search workspace"><button class="icon-button" data-action="close" aria-label="Close search">${icon('close')}</button></div><div class="command-results" id="command-results"></div><div class="search-tip">Type a name, SKU, barcode, or invoice number. Press Esc to close.</div>`,{search:true});commandResults('');}
  function commandResults(q){q=q.toLowerCase();const products=state.products.filter(p=>(p.name+' '+p.sku+' '+p.barcode).toLowerCase().includes(q)).slice(0,4),invoices=q?state.invoices.filter(i=>(i.number+' '+A.contact(state,i.customerId)?.name).toLowerCase().includes(q)).slice(0,3):[],contacts=q?state.contacts.filter(c=>(c.name+' '+c.email+' '+c.phone).toLowerCase().includes(q)).slice(0,3):[];$('#command-results').innerHTML=products.map(p=>`<button class="command-result" data-action="product-detail" data-id="${e(p.id)}">${art(p)}<div><strong>${e(p.name)}</strong><small>Product · ${e(p.sku)} · ${A.available(state,p.id)} sellable</small></div>${icon('chevron')}</button>`).join('')+invoices.map(i=>`<button class="command-result" data-action="invoice-detail" data-id="${e(i.id)}"><span class="contact-initials">${icon('invoice')}</span><div><strong>${e(i.number)} · ${e(A.contact(state,i.customerId)?.name)}</strong><small>Invoice · ${money(i.total)} · ${A.invoiceStatus(i)}</small></div>${icon('chevron')}</button>`).join('')+contacts.map(c=>`<button class="command-result" data-action="contact-detail" data-id="${e(c.id)}"><span class="contact-initials">${e(initials(c.name))}</span><div><strong>${e(c.name)}</strong><small>${e(c.type)} · ${e(c.email)}</small></div>${icon('chevron')}</button>`).join('')||empty('No results found','Try a different name or reference.','search');}
  function confirmDialog(title,text,callback,label='Confirm'){modal(title,text,`<div class="info-callout">${e(text)}</div><div class="form-footer"><button class="btn" data-action="close">Cancel</button><button class="btn primary" id="confirm-action">${e(label)}</button></div>`);$('#confirm-action').addEventListener('click',callback,{once:true});}
  function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Downloaded '+name);}
  function csv(name,columns,rows){const safe=value=>{let v=String(value??'');if(/^[=+@\-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};download(name,'\ufeff'+[columns,...rows].map(row=>row.map(safe).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
  function exportData(type){const suffix=A.today()+'.csv';
    if(type==='products')csv('aster-inventory-'+suffix,['SKU','Product','Generic','Category','Unit','Physical stock','Sellable stock','Default cost USD','Selling price USD','Reorder level','Status'],state.products.map(p=>[p.sku,p.name,p.generic,p.category,p.unit,A.onHand(state,p.id),A.available(state,p.id),p.cost,p.price,p.reorder,A.productStatus(state,p)]));
    if(type==='batches')csv('aster-batches-'+suffix,['Batch','SKU','Product','Warehouse','Quantity','Unit cost USD','Expiry','Received','Status'],state.batches.map(b=>[b.code,A.product(state,b.productId)?.sku,A.product(state,b.productId)?.name,A.warehouse(state,b.warehouseId)?.name,b.qty,b.cost,b.expiry,b.received,batchStatus(b)]));
    if(type==='invoices')csv('aster-invoices-'+suffix,['Invoice','Customer','Date','Due','Subtotal USD','Discount USD','Tax USD','Total USD','Paid USD','Outstanding USD','Status'],state.invoices.map(i=>[i.number,A.contact(state,i.customerId)?.name,i.date,i.due,i.subtotal,i.discount,i.taxAmount,i.total,i.paid,A.invoiceBalance(i),A.invoiceStatus(i)]));
    if(type==='purchases')csv('aster-purchases-'+suffix,['Purchase order','Supplier','Warehouse','Date','Expected','Total USD','Paid USD','Status'],state.purchases.map(p=>[p.number,A.contact(state,p.supplierId)?.name,A.warehouse(state,p.warehouseId)?.name,p.date,p.expected,p.total,p.paid,p.status]));
    if(type==='contacts')csv('aster-contacts-'+suffix,['Name','Type','Contact person','Email','Phone','Address'],state.contacts.map(c=>[c.name,c.type,c.person,c.email,c.phone,c.address]));
    if(type==='ledger')csv('aster-general-ledger-'+suffix,['Date','Reference','Description','Account','Debit USD','Credit USD'],[...state.journal].sort((a,b)=>a.date.localeCompare(b.date)).flatMap(j=>j.entries.map(x=>[j.date,j.reference,j.description,A.accounts.find(a=>a.id===x.account).name,x.debit,x.credit])));
    if(type==='overview'||type==='analysis'){const b=A.balances(state,A.shift(-ui.period+1));csv('aster-'+type+'-'+suffix,['Metric','Value','Period'],[['Sales revenue USD',b.revenue.balance,'Last '+ui.period+' days'],['Cost of goods USD',b.cogs.balance,'Last '+ui.period+' days'],['Gross profit USD',A.round(b.revenue.balance-b.cogs.balance),'Last '+ui.period+' days'],['Operating expenses USD',b.expense.balance,'Last '+ui.period+' days'],['Stock write-offs USD',b.loss.balance,'Last '+ui.period+' days'],['Net profit USD',A.round(b.revenue.balance-b.cogs.balance-b.expense.balance-b.loss.balance),'Last '+ui.period+' days'],['Inventory value USD',A.inventoryValue(state),'Current'],['Low-stock products',lowProducts().length,'Current'],['Expiry alerts',expiryBatches().length,'Within '+state.settings.expiryWindow+' days']]);}
  }
  const actions={
    navigate:el=>navigate(el.dataset.page),close:closeModal,help:()=>modal('Meet your pharmacy workspace','One place for a clearer day.',helpContent(),{large:true}),search:commandSearch,alerts,
    'mobile-menu':()=>{$('#sidebar').classList.toggle('open');$('#mobile-scrim').classList.toggle('open');},
    paginate:el=>{ui[el.dataset.key].page=Number(el.dataset.page);render();},graph:el=>{ui.graph=el.dataset.value;render();},attention:el=>{ui.attention=el.dataset.value;render();},
    'accounting-tab':el=>{ui.accountingTab=el.dataset.value;render();},'settings-tab':el=>{ui.settingsTab=el.dataset.value;render();},
    'product-form':el=>productForm(el.dataset.id),'product-detail':el=>productDetail(el.dataset.id),'receive-stock':el=>receiveForm(el.dataset.id),
    'batch-detail':el=>batchDetail(el.dataset.id),transfer:el=>transferForm(el.dataset.id),dispose:el=>disposeForm(el.dataset.id),
    quarantine:el=>{const b=state.batches.find(b=>b.id===el.dataset.id);mutation(s=>A.setQuarantine(s,b.id,!b.quarantined),b.quarantined?'Batch released.':'Batch quarantined.');},
    'warehouse-inventory':el=>{ui.inventory.warehouse=el.dataset.id;ui.inventory.page=1;navigate('inventory');},
    'movement-history':()=>modal('Workspace activity','A traceable history of every operation.',movementTable(state.movements),{large:true}),
    'invoice-form':el=>invoiceForm(el.dataset.id),'invoice-detail':el=>invoiceDetail(el.dataset.id),
    'issue-invoice':el=>mutation(s=>A.issueInvoice(s,el.dataset.id),'Invoice issued. Stock and accounts updated.',i=>invoiceDetail(i.id)),
    'invoice-payment':el=>paymentForm(el.dataset.id),'bill-payment':el=>paymentForm(el.dataset.id,true),
    'delete-draft':el=>confirmDialog('Delete this draft?','Draft '+state.invoices.find(i=>i.id===el.dataset.id).number+' will be removed. Stock and accounts are unaffected.',()=>mutation(s=>A.deleteDraft(s,el.dataset.id),'Draft deleted.'),'Delete draft'),
    print:()=>window.print(),
    'purchase-form':purchaseForm,'purchase-detail':el=>purchaseDetail(el.dataset.id),'purchase-receive':el=>purchaseReceive(el.dataset.id),
    'cancel-purchase':el=>confirmDialog('Cancel this purchase order?','The unreceived order remains in your history with a canceled status.',()=>mutation(s=>A.cancelPurchase(s,el.dataset.id),'Purchase order canceled.'),'Cancel order'),
    'expense-form':expenseForm,'contact-form':el=>contactForm(el.dataset.id),'contact-detail':el=>contactDetail(el.dataset.id),
    'add-line':()=>{const purchase=!!$('#purchase-form');$('#line-rows').insertAdjacentHTML('beforeend',lineRow({},purchase));updateLineTotals();},
    'remove-line':el=>{const rows=$$('[data-line]');if(rows.length===1){toast('Keep at least one product line.',true);return;}el.closest('[data-line]').remove();updateLineTotals();},
    'export-products':()=>exportData('products'),'export-batches':()=>exportData('batches'),'export-invoices':()=>exportData('invoices'),'export-purchases':()=>exportData('purchases'),'export-contacts':()=>exportData('contacts'),'export-ledger':()=>exportData('ledger'),'export-overview':()=>exportData('overview'),'export-analysis':()=>exportData('analysis'),
    backup:()=>download('aster-backup-'+A.today()+'.json',JSON.stringify(state,null,2),'application/json'),restore:()=>$('#restore-file').click(),
    'reset-demo':()=>confirmDialog('Restore sample workspace?','All current records will be replaced with fresh sample data. Download a backup first if you want to keep your work.',()=>{try{const fresh=A.seed();A.persist(fresh);state=fresh;closeModal();render();toast('Sample workspace restored.');}catch(err){toast(err.message,true);}},'Restore samples'),
    'empty-workspace':()=>confirmDialog('Begin an empty workspace?','All products, batches, contacts, invoices, purchase orders, and financial records will be cleared. Company settings and warehouse locations are kept.',()=>{const clean={...state,counters:{invoice:1,purchase:1},products:[],batches:[],contacts:[],invoices:[],purchases:[],receipts:[],journal:[],expenses:[],movements:[]};try{A.persist(clean);state=clean;closeModal();render();toast('Your empty workspace is ready.');}catch(err){toast(err.message,true);}},'Start empty'),
    submit:el=>el.closest('form')?.requestSubmit()
  };
  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el){event.preventDefault();actions[el.dataset.action]?.(el);}else if(event.target.classList.contains('overlay'))closeModal();});
  $('#mobile-scrim').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#mobile-scrim').classList.remove('open');});
  document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();commandSearch();}if(event.key==='Escape'){closeModal();$('#sidebar').classList.remove('open');$('#mobile-scrim').classList.remove('open');}if(event.key==='Tab'&&$('.modal')){const targets=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea,a[href]',$('.modal')).filter(x=>x.type!=='hidden');if(targets.length){const first=targets[0],last=targets[targets.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}}});
  document.addEventListener('input',event=>{const target=event.target;if(target.id==='command-q')commandResults(target.value);if(target.dataset.filter && target.tagName==='INPUT'){const [key,name]=target.dataset.filter.split('.'),pos=target.selectionStart;ui[key][name]=target.value;ui[key].page=1;const id=target.id;render();const next=$('#'+id);next?.focus();next?.setSelectionRange(pos,pos);}if(target.closest('#invoice-form,#purchase-form'))updateLineTotals();});
  document.addEventListener('change',async event=>{
    const t=event.target;if(t.dataset.ui==='period'){ui.period=Number(t.value);render();}
    if(t.dataset.filter&&t.tagName==='SELECT'){const [key,name]=t.dataset.filter.split('.');ui[key][name]=t.value;ui[key].page=1;render();}
    if(t.name==='line-product'){const p=A.product(state,t.value),row=t.closest('[data-line]');if(p)$('[name="line-price"]',row).value=t.closest('#purchase-form')?p.cost:p.price;updateLineTotals();}
    if(t.name==='productId'&&t.closest('#receive-form')){const p=A.product(state,t.value);if(p){$('[name="cost"]').value=p.cost;$('[name="supplierId"]').value=p.supplierId;}}
    if(t.id==='restore-file'&&t.files?.[0]){try{if(t.files[0].size>10*1024*1024)throw new Error('Backup must be smaller than 10 MB.');const backup=A.validateBackup(JSON.parse(await t.files[0].text()));confirmDialog('Restore this backup?',`Replace your workspace with ${backup.products.length} products and ${backup.invoices.length} invoices from the selected backup.`,()=>{try{A.persist(backup);state=backup;closeModal();render();toast('Backup restored.');}catch(err){toast(err.message,true);}},'Restore backup');}catch(error){toast(error.message,true);}t.value='';}
  });
  document.addEventListener('submit',event=>{event.preventDefault();const form=event.target,data=Object.fromEntries(new FormData(form)),id=form.dataset.id;
    if(form.id==='product-form')mutation(s=>A.saveProduct(s,{...data,color:id?A.product(s,id).color:'#78a68c',shape:id?A.product(s,id).shape:data.unit==='bottle'?'bottle':data.unit==='tube'?'tube':'box'},id),'Product saved.');
    if(form.id==='receive-form')mutation(s=>A.receiveStock(s,data),'Stock received. Inventory and accounts updated.');
    if(form.id==='transfer-form')mutation(s=>A.transferStock(s,data),'Stock transferred.');
    if(form.id==='dispose-form')mutation(s=>A.disposeBatch(s,id,data.reason),'Stock written off. Inventory and accounts updated.');
    if(form.id==='invoice-form'){const lines=readLines(),issue=event.submitter?.value==='issue';mutation(s=>{const i=A.createInvoice(s,{...data,lines},id);if(issue)A.issueInvoice(s,i.id);return i;},issue?'Invoice issued. Stock and accounts updated.':'Draft saved.',i=>invoiceDetail(i.id));}
    if(form.id==='invoice-payment-form')mutation(s=>A.payInvoice(s,id,data.amount,data.method,data.date),'Payment recorded. Accounts updated.');
    if(form.id==='bill-payment-form')mutation(s=>A.payBill(s,id,data.amount,data.date),'Supplier payment recorded.');
    if(form.id==='purchase-form')mutation(s=>A.createPurchase(s,{...data,lines:readLines(true)}),'Purchase order created.');
    if(form.id==='purchase-receive-form'){const p=state.purchases.find(p=>p.id===id);mutation(s=>A.receivePurchase(s,id,p.lines.map((l,n)=>({code:data['batch-'+n],expiry:data['expiry-'+n]})),data.date),'Purchase order received. Stock and payables updated.');}
    if(form.id==='expense-form')mutation(s=>A.addExpense(s,data),'Expense recorded.');
    if(form.id==='contact-form')mutation(s=>A.saveContact(s,data,id),'Contact saved.');
    if(form.id==='settings-form')mutation(s=>{const tax=Number(data.taxRate),window=Number(data.expiryWindow),prefix=String(data.invoicePrefix||'').trim().toUpperCase();if(!String(data.company).trim())throw new Error('Enter a company name.');if(!/^[A-Z0-9-]{1,12}$/.test(prefix))throw new Error('Invoice prefix must have 1–12 letters, digits, or hyphens.');if(!Number.isFinite(tax)||tax<0||tax>100)throw new Error('Tax rate must be between 0 and 100.');if(!Number.isInteger(window)||window<1||window>365)throw new Error('Expiry window must be between 1 and 365 days.');s.settings={...s.settings,...data,taxRate:A.round(tax),expiryWindow:window,invoicePrefix:prefix};},'Settings saved.');
  });
  window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(isPage(page)&&page!==ui.page){ui.page=page;closeModal();render();window.scrollTo(0,0);}});
  render();
})();

</script>
